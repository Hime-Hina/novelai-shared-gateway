name: Gateway checks

on:
  push:
    branches: [main]
    tags: ['**']
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  classify-changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.changes.outputs.docs_only }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify documentation-only CI classification
        run: python3 tests/deployment/ci-docs-only.test.py
      - name: Detect documentation-only changes
        id: changes
        if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: bash .github/ci-docs-only.sh "$BASE_SHA" >> "$GITHUB_OUTPUT"

  backend-tests:
    needs: classify-changes
    if: needs.classify-changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify production backup and retention with synthetic data
        run: python3 tests/deployment/backup-production.test.py
      - run: pnpm test

  web-and-package:
    needs: classify-changes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run format:check
      - run: pnpm run architecture:check
      - name: Check immutable migration history
        env:
          MIGRATION_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || '7c55c6dad7ec59b04550ee9e2f1a0db6047db791' }}
        run: pnpm run migration:check --base "$MIGRATION_BASE"
      - run: node -e "const db = require('better-sqlite3')(':memory:'); if (db.pragma('integrity_check', {simple:true}) !== 'ok') process.exit(1); db.close();"
      - run: pnpm run typecheck
      - run: pnpm run check
      - run: pnpm --filter @novelai-gateway/web typecheck
      - if: needs.classify-changes.outputs.docs_only != 'true'
        run: pnpm --filter @novelai-gateway/web test
      - run: pnpm --filter @novelai-gateway/executor typecheck
      - if: needs.classify-changes.outputs.docs_only != 'true'
        run: pnpm --filter @novelai-gateway/executor test
      - if: needs.classify-changes.outputs.docs_only != 'true'
        run: pnpm --filter @novelai-gateway/executor build
      - name: Verify Nuxt routes, streaming and process isolation
        if: needs.classify-changes.outputs.docs_only != 'true'
        run: pnpm --filter @novelai-gateway/web test:executor
      - if: needs.classify-changes.outputs.docs_only != 'true'
        run: docker build --tag novelai-shared-gateway:check .
      - if: needs.classify-changes.outputs.docs_only != 'true'
        run: docker build --file web/Dockerfile --tag novelai-shared-gateway-web:check .
      - if: needs.classify-changes.outputs.docs_only != 'true'
        run: docker build --file executor/Dockerfile --tag novelai-shared-gateway-executor:check .
      - name: Verify packaged executor over real HTTP
        if: needs.classify-changes.outputs.docs_only != 'true'
        run: >-
          docker run --rm --network none --read-only
          --tmpfs /tmp:rw,uid=1000,gid=1000
          --mount "type=bind,source=${{ github.workspace }}/executor/tests/integration,target=/checks,readonly"
          -e EXECUTOR_TEST_ENTRY=/app/.output/server/start.mjs
          novelai-shared-gateway-executor:check
          node --test /checks/runtime-http.test.mjs
      - name: Export verified Linux test release
        if: needs.classify-changes.outputs.docs_only != 'true'
        shell: bash
        run: |
          set -euo pipefail
          release_name="novelai-gateway-test-${GITHUB_SHA}-linux-x64"
          release_dir="${RUNNER_TEMP}/${release_name}"
          test "$(docker image inspect --format '{{.Architecture}}' novelai-shared-gateway-executor:check)" = amd64
          test "$(docker image inspect --format '{{.Architecture}}' novelai-shared-gateway-web:check)" = amd64
          mkdir -p "$release_dir"/{bin,executor,web,licenses,systemd,docs,ops} dist
          executor_container=$(docker create novelai-shared-gateway-executor:check)
          web_container=$(docker create novelai-shared-gateway-web:check)
          trap 'docker rm "$executor_container" "$web_container" >/dev/null' EXIT
          # docker cp and tar preserve pnpm relative symlinks; do not use -L or --dereference.
          docker cp "$executor_container:/app/.output" "$release_dir/executor/.output"
          docker cp "$executor_container:/app/node_modules" "$release_dir/executor/node_modules"
          docker cp "$executor_container:/usr/local/bin/node" "$release_dir/bin/node"
          docker cp "$executor_container:/usr/local/LICENSE" "$release_dir/licenses/node.LICENSE"
          docker cp "$web_container:/app/.output" "$release_dir/web/.output"
          docker cp "$web_container:/app/dependency-licenses" "$release_dir/licenses/web-dependencies"
          docker cp "$web_container:/app/web/THIRD_PARTY_NOTICES.md" "$release_dir/licenses/THIRD_PARTY_NOTICES.md"
          for name in LICENSE NOTICE.md UPSTREAM-LICENSE; do
            docker cp "$web_container:/app/$name" "$release_dir/$name"
          done
          cp pnpm-lock.yaml "$release_dir/pnpm-lock.yaml"
          cp deploy/systemd/*.service deploy/production-*.env.example "$release_dir/systemd/"
          cp docs/operations/test-deployment.md docs/operations/production-release.md "$release_dir/docs/"
          cp scripts/backup-production.py scripts/bridge-owner-session.mjs "$release_dir/ops/"
          mkdir -p "$RUNNER_TEMP/unit-check"
          for unit in "$release_dir/systemd/"*.service; do
            sed -e "s|/opt/novelai-shared-gateway-test/current|$release_dir|g" \
              -e "s|/opt/novelai-shared-gateway/current|$release_dir|g" \
              "$unit" > "$RUNNER_TEMP/unit-check/$(basename "$unit")"
          done
          systemd-analyze verify --man=no "$RUNNER_TEMP/unit-check/"*.service
          test -z "$(find "$release_dir" -type f \( -name '*.sqlite' -o -name '*.sqlite-wal' -o -name '.env' -o -name '.env.*' -o -name 'bootstrap-credentials.json' \) -print -quit)"
          {
            printf 'commit=%s\nplatform=linux-x64\n' "$GITHUB_SHA"
            printf 'executor_image=%s\n' "$(docker image inspect --format '{{.Id}}' novelai-shared-gateway-executor:check)"
            printf 'web_image=%s\n' "$(docker image inspect --format '{{.Id}}' novelai-shared-gateway-web:check)"
            printf 'node=%s\n' "$("$release_dir/bin/node" --version)"
            printf 'lock_sha256=%s\n' "$(sha256sum pnpm-lock.yaml | cut -d ' ' -f 1)"
          } > "$release_dir/RELEASE.txt"
          test "$("$release_dir/bin/node" --version)" = v22.23.4
          tar -C "$RUNNER_TEMP" -czf "dist/$release_name.tar.gz" "$release_name"
          mkdir -p "$RUNNER_TEMP/release-check"
          tar -C "$RUNNER_TEMP/release-check" -xzf "dist/$release_name.tar.gz"
          # Validate the extracted Linux tree without workspace dependency fallback.
          docker run --rm --network none --read-only --entrypoint /release/bin/node \
            --tmpfs /tmp:rw,uid=1000,gid=1000 \
            --mount "type=bind,source=$RUNNER_TEMP/release-check/$release_name,target=/release,readonly" \
            novelai-shared-gateway-executor:check --input-type=module -e '
              import assert from "node:assert/strict";
              import { createRequire } from "node:module";
              import { access, mkdtemp, readFile, readdir } from "node:fs/promises";
              import { spawnSync } from "node:child_process";
              const root = "/release/executor/.output/server/node_modules/novelai-shared-gateway/";
              await assert.rejects(access(root + "public"), { code: "ENOENT" });
              const serverEntries = await readdir(root + "server", { withFileTypes: true });
              assert.deepEqual(serverEntries.filter(entry => entry.isFile() && entry.name.endsWith(".js")).map(entry => entry.name).sort(), ["gateway-runtime.js", "index.js"]);
              const require = createRequire(root + "package.json");
              assert.ok(require.resolve("better-sqlite3").startsWith("/release/executor/node_modules/"));
              const db = require("better-sqlite3") (":memory:");
              const { migrateStorage } = await import(root + "server/storage/sqlite-migrations.js");
              migrateStorage(db);
              assert.equal(db.pragma("integrity_check", { simple: true }), "ok");
              const journal = JSON.parse(await readFile(root + "server/migrations/meta/_journal.json", "utf8"));
              assert.equal(db.prepare("SELECT COUNT(*) n FROM __drizzle_migrations").get().n, journal.entries.length);
              for (const entry of journal.entries) await access(root + "server/migrations/" + entry.tag + ".sql");
              for (const table of ["domain_events", "event_commits", "event_streams", "generation_contexts", "artifact_inputs", "generation_diagnostics"])
                assert.ok(db.prepare("SELECT name FROM sqlite_schema WHERE type=? AND name=?").get("table", table));
              db.close();
              for (const entry of ["server/storage/sqlite-read-worker.js", "server/events/event-store.js", "server/events/domain-events.js", "server/generation/admission.js", "scripts/replay-events.mjs", "scripts/create-test-copy.mjs"])
                await access(root + entry);
              await access("/release/web/.output/server/index.mjs");
              const { JsonStore } = await import(root + "server/storage/sqlite-store.js");
              const { readArtifactInput } = await import(root + "server/events/event-store.js");
              const directory = await mkdtemp("/tmp/nai-release-replay-");
              const source = new JsonStore(directory + "/source"); await source.init();
              const at = "2026-11-01T00:00:00.000Z", inline = "c3ludGhldGljLXBhY2thZ2UtYXJ0aWZhY3Q=";
              await source.write({ settings: source.db.settings, accounts: [], cards: [], ledger: [],
                users: [{ id: "member", token: "synthetic-package-member", enabled: true }],
                jobs: [{ id: "package-job", userToken: "synthetic-package-member", status: "failed", createdAt: at, imageId: "package-image", errorDetail: "synthetic private diagnostic",
                  request: { model: "nai-diffusion-4-5-full", prompt: "synthetic private input" } }],
                images: [{ id: "package-image", token: "synthetic-package-member", base64: inline, prompt: "synthetic private input", mimeType: "application/octet-stream", createdAt: at }] });
              source.sqlite.prepare("INSERT INTO generation_idempotency VALUES (?,?,?,?,?,?,?,?)").run("member", "generate", "synthetic-key-hash", "synthetic-intent", "{\"defaultNegative\":\"synthetic private default\"}", "package-job", null, at);
              await source.enableEventAuthority(); const sourcePath = source.dbPath; await source.close();
              const original = await readFile(sourcePath), targetPath = directory + "/rebuilt.sqlite";
              const run = (...options) => {
                const result = spawnSync(process.execPath, [root + "scripts/replay-events.mjs", "--source=" + sourcePath, "--target=" + targetPath, ...options], { encoding: "utf8", timeout: 15000 });
                assert.equal(result.status, 0, result.stderr); return JSON.parse(result.stdout);
              };
              assert.equal(run("--max-commits=1").commits, 1);
              const complete = run(); assert.ok(complete.commits > 0); assert.equal(complete.networkCalls, 0); assert.equal(complete.dispatches, 0);
              assert.equal(run().commits, 0); assert.deepEqual(await readFile(sourcePath), original);
              const rebuilt = require("better-sqlite3")(targetPath, { readonly: true });
              assert.equal(rebuilt.prepare("SELECT status FROM jobs WHERE id=?").get("package-job").status, "failed");
              assert.equal(readArtifactInput(rebuilt, "package-image").base64, inline);
              assert.ok(rebuilt.prepare("SELECT payload FROM generation_contexts").get().payload.includes("synthetic private default"));
              assert.equal(rebuilt.prepare("SELECT detail FROM generation_diagnostics").get().detail, "synthetic private diagnostic");
              assert.equal(rebuilt.pragma("integrity_check", { simple: true }), "ok"); rebuilt.close();
            '
          (
            cd dist
            sha256sum "$release_name.tar.gz" > "$release_name.tar.gz.sha256"
          )
      - name: Upload verified Linux test release
        if: needs.classify-changes.outputs.docs_only != 'true'
        # Official actions/upload-artifact v4.6.2; upload the tar to retain file modes/symlinks.
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: novelai-gateway-test-${{ github.sha }}-linux-x64
          path: |
            dist/novelai-gateway-test-*.tar.gz
            dist/novelai-gateway-test-*.tar.gz.sha256
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  offline-validation:
    needs: [classify-changes, backend-tests, web-and-package]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require successful validation results
        shell: bash
        env:
          CLASSIFICATION_RESULT: ${{ needs.classify-changes.result }}
          DOCS_ONLY: ${{ needs.classify-changes.outputs.docs_only }}
          BACKEND_RESULT: ${{ needs.backend-tests.result }}
          PACKAGE_RESULT: ${{ needs.web-and-package.result }}
        run: |
          expected_backend=success
          if [[ "$DOCS_ONLY" == true ]]; then
            expected_backend=skipped
          fi
          printf 'classify-changes=%s backend-tests=%s (expected %s) web-and-package=%s\n' \
            "$CLASSIFICATION_RESULT" "$BACKEND_RESULT" "$expected_backend" "$PACKAGE_RESULT"
          [[ "$CLASSIFICATION_RESULT" == success &&
             "$BACKEND_RESULT" == "$expected_backend" &&
             "$PACKAGE_RESULT" == success ]]

  node24-reader:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify isolated SQLite readers under Node 24
        run: node --test --test-concurrency=1 tests/integration/activity-storage.test.mjs tests/integration/activity-heatmap-http.test.mjs
      - run: pnpm run build
      - name: Include immutable migration assets in the JavaScript reader package
        run: cp -R server/migrations .output/backend/server/migrations
      - name: Verify packaged JavaScript reader under parent-only flags
        run: >-
          node --v8-pool-size=2 --input-type=module -e '
          import assert from "node:assert/strict";
          import { mkdtemp, rm } from "node:fs/promises";
          import { tmpdir } from "node:os";
          import path from "node:path";
          import { JsonStore } from "./.output/backend/server/storage/sqlite-store.js";
          const directory = await mkdtemp(path.join(tmpdir(), "nai-reader-node24-"));
          const store = new JsonStore(directory);
          try { await store.init(); assert.deepEqual(await store.readActivityDays({since:"2026-01-01T00:00:00Z",until:"2027-01-01T00:00:00Z"}),[]); }
          finally { await store.close(); await rm(directory,{recursive:true,force:true}); }
          '

  caddy-routing:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Build real Caddy routing checks
        run: docker build --file tests/deployment/Dockerfile --tag novelai-caddy-routing:check .
      - name: Verify Caddy HTTP routing without external networking
        run: >-
          docker run --rm --network none --read-only
          --tmpfs /tmp:rw,uid=1000,gid=1000
          novelai-caddy-routing:check
